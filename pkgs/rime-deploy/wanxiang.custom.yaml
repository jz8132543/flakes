模糊音:
  __append:
    # # n - l
    # - derive/^l/n
    # - derive/^n/l
    # # r - y     开头
    # - derive/^y/r
    # - derive/^r/y
    # # h - f     开头
    # - derive/^h/f
    # - derive/^f/h
    # # r - l     开头
    # - derive/^r/l
    # - derive/^l/r
    # # k - g     开头
    # - derive/^k/g
    # - derive/^g/k
    # en - eng
    - derive/(ē|é|ě|è|e)ng(.*)$/$1n$2
    - derive/(ē|é|ě|è|e)n(.*)$/$1ng$2
    # in - ing
    - derive/(ī|í|ǐ|ì|i)ng(.*)$/$1n$2
    - derive/(ī|í|ǐ|ì|i)n(.*)$/$1ng$2
    # # c - ch
    # - derive/^c([^h]*)/ch$1
    # - derive/^ch/c
    # # z - zh
    # - derive/^z([^h]*)/zh$1
    # - derive/^zh/z
    # # s - sh
    # - derive/^s([^h]*)/sh$1
    # - derive/^sh/s
#使用方案跟在拼写运算后面
18jian:
  __append:
    - xlit/qwertyuiopasdfghjklzxcvbnm/QWWRRYUIIPASSFFHJJLZXXVBBM
14jian:
  __append:
    - xlit/qwertyuiopasdfghjklzxcvbnm/QQEETTUUOOAADDGGJJLZZCCBBM

# 开启 Octagram 语法模型支持
__include: octagram #启用语法模型
octagram:
  __patch:
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 8 #命中的最长词组
    collocation_min_length: 2 #命中的最短词组，搭配词频健全的词库时候应当最小值设为3避开2字高频词
    collocation_penalty: -10 #默认-12 对常见搭配词组施加的惩罚值。较高的负值会降低这些搭配被选中的概率，防止过于频繁地出现某些固定搭配。
    non_collocation_penalty: -12 #默认-12 对非搭配词组施加的惩罚值。较高的负值会降低非搭配词组被选中的概率，避免不合逻辑或不常见的词组组合。
    weak_collocation_penalty: -24 #默认-24 对弱搭配词组施加的惩罚值。保持默认值通常是为了有效过滤掉不太常见但仍然合理的词组组合。
    rear_penalty: -30 #默认-18 对词组中后续词语的位置施加的惩罚值。较高的负值会降低某些词语在句子后部出现的概率，防止句子结构不自然。
  translator/contextual_suggestions: false
  translator/max_homophones: 5
  translator/max_homographs: 5
