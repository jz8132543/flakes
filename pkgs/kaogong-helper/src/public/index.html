<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>考公助手 — 极简刷题，高效上岸</title>
    <meta
      name="description"
      content="面向公务员考试的极简刷题平台，热力图追踪学习进度，名师多解法对比，AI 私教实时答疑。"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-logo" onclick="navigate('landing')">考公助手</div>
      <div class="nav-tabs" id="nav-tabs" style="display: none">
        <button
          class="nav-tab"
          data-tab="dashboard"
          onclick="navigate('dashboard', this)"
        >
          主页
        </button>
        <button
          class="nav-tab"
          data-tab="practice"
          onclick="navigate('practice', this)"
        >
          刷题
        </button>
        <button
          class="nav-tab"
          data-tab="review"
          onclick="navigate('review', this)"
        >
          复习
        </button>
        <button
          class="nav-tab"
          data-tab="cohorts"
          onclick="navigate('cohorts', this)"
        >
          打卡班
        </button>
        <button
          class="nav-tab"
          data-tab="settings"
          onclick="navigate('settings', this)"
        >
          设置
        </button>
      </div>
      <div class="nav-right">
        <div id="nav-user" class="nav-user" style="display: none">
          <span id="nav-uname"></span>
        </div>
        <button
          id="nav-login-btn"
          class="btn btn-p btn-sm"
          onclick="openModal('login')"
        >
          登录
        </button>
      </div>
    </nav>

    <main class="container" id="app"></main>

    <button id="ai-fab" onclick="openAITutor()">💬</button>

    <div id="modals-root"></div>
    <div id="toast"></div>

    <script src="/js/app.js"></script>
  </body>
</html>
