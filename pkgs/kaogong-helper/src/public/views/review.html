<div id="v-review" class="view">
  <div class="flex gap-sm mb-lg">
    <button
      class="btn btn-g rv-tab active"
      onclick="switchReviewTab('solutions', this)"
    >
      题目解析
    </button>
    <button
      class="btn btn-g rv-tab"
      onclick="switchReviewTab('mistakes', this)"
    >
      错题本
    </button>
    <button class="btn btn-g rv-tab" onclick="switchReviewTab('mastery', this)">
      掌握度
    </button>
  </div>
  <div id="rv-solutions"></div>
  <div id="rv-mistakes" style="display: none"></div>
  <div id="rv-mastery" style="display: none"></div>
</div>
