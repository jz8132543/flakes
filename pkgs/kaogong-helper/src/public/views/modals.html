<!-- Login -->
<div id="modal-login" class="modal">
  <div class="modal-box">
    <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.2rem">
      登录
    </h3>
    <div class="flex-col gap-sm" style="margin-bottom: 1rem">
      <input
        class="input"
        id="login-user"
        placeholder="用户名"
        autocomplete="username"
      />
      <input
        class="input"
        id="login-pass"
        type="password"
        placeholder="密码"
        autocomplete="current-password"
      />
    </div>
    <button class="btn btn-p btn-block" onclick="login()">登录</button>
    <div
      class="text-center"
      style="margin-top: 0.8rem; font-size: 0.78rem; color: var(--text-3)"
    >
      <span style="cursor: pointer; color: var(--blue)" onclick="register()"
        >注册新账号</span
      >
      <span style="margin: 0 0.4rem">·</span>
      <span style="cursor: pointer" onclick="closeModal('login')">取消</span>
    </div>
  </div>
</div>

<!-- Cashier -->
<div id="modal-cashier" class="modal">
  <div class="modal-box">
    <div
      class="flex justify-between items-center"
      style="margin-bottom: 1.2rem"
    >
      <h3 style="font-size: 1.1rem; font-weight: 700">充值</h3>
      <span
        style="cursor: pointer; color: var(--text-3); font-size: 1.2rem"
        onclick="closeModal('cashier')"
        >×</span
      >
    </div>
    <div class="flex-col gap-sm">
      <div
        class="card card-click"
        onclick="simulatePay('PRO_MONTHLY', '冲刺Pro月卡', 68)"
        style="padding: 0.8rem"
      >
        <div class="flex justify-between items-center">
          <div>
            <div style="font-weight: 600; font-size: 0.88rem">
              冲刺 Pro 月卡
            </div>
            <div style="font-size: 0.75rem; color: var(--text-3)">
              30,000 Token + VIP 30天
            </div>
          </div>
          <span style="font-weight: 700; color: var(--blue)">¥68</span>
        </div>
      </div>
      <div
        class="card card-click"
        onclick="simulatePay('VIP_QUARTERLY', '保过VIP季卡', 198)"
        style="padding: 0.8rem"
      >
        <div class="flex justify-between items-center">
          <div>
            <div style="font-weight: 600; font-size: 0.88rem">
              保过 VIP 季卡
            </div>
            <div style="font-size: 0.75rem; color: var(--text-3)">
              100,000 Token + VIP 90天
            </div>
          </div>
          <span style="font-weight: 700; color: var(--amber)">¥198</span>
        </div>
      </div>
    </div>
    <div
      class="text-center"
      style="margin-top: 1rem; font-size: 0.75rem; color: var(--text-3)"
    >
      点击套餐即可模拟支付
    </div>
  </div>
</div>

<!-- AI Tutor -->
<div id="modal-ai" class="modal">
  <div class="modal-box" style="max-width: 480px">
    <div class="flex justify-between items-center" style="margin-bottom: 1rem">
      <h3 style="font-size: 1.1rem; font-weight: 700">AI 名师助教</h3>
      <span
        style="cursor: pointer; color: var(--text-3); font-size: 1.2rem"
        onclick="closeModal('ai')"
        >×</span
      >
    </div>
    <div style="font-size: 0.82rem; color: var(--text-2); margin-bottom: 1rem">
      向名师 AI 分身提问，获得针对性解题指导。每次提问消耗 Token。
    </div>
    <textarea
      class="input"
      id="ai-prompt"
      rows="3"
      placeholder="输入你的问题…"
      style="resize: vertical; margin-bottom: 0.8rem"
    ></textarea>
    <button class="btn btn-p btn-block" onclick="sendAI()">发送提问</button>
    <div
      id="ai-reply"
      style="
        display: none;
        margin-top: 1rem;
        padding: 0.8rem;
        background: var(--bg-input);
        border-radius: var(--r-sm);
        font-size: 0.85rem;
        color: var(--text-2);
        line-height: 1.7;
        white-space: pre-wrap;
        max-height: 300px;
        overflow-y: auto;
      "
    ></div>
  </div>
</div>
