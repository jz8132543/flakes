<div id="v-practice" class="view">
  <!-- Mode Select -->
  <div id="p-select">
    <div style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.8rem">
      选择练习模式
    </div>
    <div class="grid grid-3 mb">
      <div
        class="card card-click pm"
        onclick="selectPracticeMode('FULL_PAPER', this)"
      >
        <div
          style="font-weight: 600; font-size: 0.88rem; margin-bottom: 0.2rem"
        >
          整套试卷
        </div>
        <div style="font-size: 0.78rem; color: var(--text-3)">
          120分钟全真模考
        </div>
      </div>
      <div
        class="card card-click pm"
        onclick="selectPracticeMode('MODULE', this)"
      >
        <div
          style="font-weight: 600; font-size: 0.88rem; margin-bottom: 0.2rem"
        >
          按模块
        </div>
        <div style="font-size: 0.78rem; color: var(--text-3)">某个行测分类</div>
      </div>
      <div
        class="card card-click pm"
        onclick="selectPracticeMode('SKILL_TAG', this)"
      >
        <div
          style="font-weight: 600; font-size: 0.88rem; margin-bottom: 0.2rem"
        >
          按技巧
        </div>
        <div style="font-size: 0.78rem; color: var(--text-3)">
          针对特定解题技巧
        </div>
      </div>
    </div>
    <div id="p-sub"></div>
    <button
      id="p-start"
      class="btn btn-p mt"
      style="display: none"
      onclick="startPracticeSession()"
    >
      开始做题
    </button>
  </div>

  <!-- Arena -->
  <div id="p-arena" style="display: none">
    <div class="flex justify-between items-center mb">
      <span style="font-size: 0.82rem; color: var(--text-2)" id="a-prog"
        >1 / 10</span
      >
    </div>
    <div class="progress mb">
      <div
        class="progress-fill"
        id="a-bar"
        style="width: 10%; background: var(--blue)"
      ></div>
    </div>
    <div class="card mb">
      <div
        id="a-q"
        style="font-size: 0.92rem; line-height: 1.8; margin-bottom: 1rem"
      ></div>
      <div id="a-opts" class="flex-col gap-sm"></div>
    </div>
    <div class="flex justify-between mt">
      <button class="btn btn-g" onclick="prevQ()">上一题</button>
      <button class="btn btn-g" onclick="openAITutor()">问 AI</button>
      <button class="btn btn-g" onclick="nextQ()">下一题</button>
    </div>
    <button class="btn btn-p btn-block mt" onclick="submitPractice()">
      交卷
    </button>
  </div>
</div>
