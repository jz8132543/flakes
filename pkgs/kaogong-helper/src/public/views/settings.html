<div id="v-settings" class="view">
  <div class="grid grid-2 gap-lg mb-lg">
    <!-- Profile -->
    <div class="card">
      <div style="font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem">
        个人信息
      </div>
      <div class="mb">
        <div class="label">用户名</div>
        <div
          id="s-uname"
          style="font-size: 0.88rem; color: var(--text-2)"
        ></div>
      </div>
      <div class="mb">
        <div class="label">考试目标</div>
        <input class="input" id="s-target" placeholder="例：2026年国考" />
      </div>
      <div class="mb">
        <div class="label">目标日期</div>
        <input class="input" id="s-date" type="date" />
      </div>
      <button class="btn btn-p btn-sm" onclick="saveProfile()">保存</button>
    </div>

    <!-- Token -->
    <div class="card">
      <div style="font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem">
        Token & VIP
      </div>
      <div class="mb">
        <div class="label">Token 余额</div>
        <div
          id="s-token-val"
          style="font-size: 1.1rem; font-weight: 700; color: var(--blue)"
        >
          0
        </div>
        <div class="progress mt" style="height: 6px">
          <div
            class="progress-fill"
            id="s-token-bar"
            style="width: 0%; background: var(--blue)"
          ></div>
        </div>
      </div>
      <div class="mb">
        <div class="label">会员状态</div>
        <div id="s-vip" style="font-size: 0.85rem; color: var(--text-2)">—</div>
      </div>
      <button class="btn btn-p btn-sm" onclick="openCashier()">充值</button>
    </div>
  </div>

  <!-- Ledger -->
  <div class="card">
    <div style="font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem">
      充值流水
    </div>
    <div style="overflow-x: auto">
      <table class="tbl">
        <thead>
          <tr>
            <th>日期</th>
            <th>类型</th>
            <th>数量</th>
            <th>描述</th>
          </tr>
        </thead>
        <tbody id="s-ledger-body"></tbody>
      </table>
    </div>
  </div>
</div>
