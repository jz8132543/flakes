<div id="v-dashboard" class="view">
  <!-- Stats -->
  <div class="grid grid-3 mb-lg">
    <div class="stat-card">
      <div class="stat-lbl">连续打卡</div>
      <div class="stat-val" id="d-streak" style="color: var(--amber)">0 天</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">累计做题</div>
      <div class="stat-val" id="d-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Token 余额</div>
      <div class="stat-val" id="d-token" style="color: var(--blue)">0</div>
    </div>
  </div>

  <!-- Heatmap -->
  <div class="card mb-lg">
    <div class="flex justify-between items-center mb">
      <span style="font-size: 0.9rem; font-weight: 600">学习热力图</span>
      <span
        style="font-size: 0.78rem; color: var(--text-3)"
        id="hm-summary"
      ></span>
    </div>
    <div id="heatmap" class="heatmap"></div>
    <div
      class="flex items-center gap-sm"
      style="
        justify-content: flex-end;
        margin-top: 0.5rem;
        font-size: 0.72rem;
        color: var(--text-3);
      "
    >
      少 <span class="hm"></span><span class="hm l1"></span
      ><span class="hm l2"></span><span class="hm l3"></span
      ><span class="hm l4"></span> 多
    </div>
  </div>

  <!-- Categories -->
  <div style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.8rem">
    行测分类
  </div>
  <div id="cat-grid" class="grid grid-auto mb-lg"></div>
</div>
