<section id="view-gacha" class="section-view">
  <div class="glass-card" style="margin-bottom: 2rem">
    <div class="card-title">
      <span>🎁 每日知识刮刮乐盲盒 (Knowledge Gacha)</span>
      <button
        class="btn-checkin"
        style="width: auto; margin-left: auto"
        onclick="drawGacha()"
      >
        🎰 消耗契约积分抽一次
      </button>
    </div>
    <div
      id="gacha-result"
      style="
        padding: 1.5rem;
        background: rgba(251, 191, 36, 0.1);
        border: 1px dashed var(--accent-amber);
        border-radius: 12px;
        color: var(--accent-amber);
        text-align: center;
        font-weight: 700;
      "
    >
      点击上方按钮进行今日刮刮乐盲盒抽卡！赢取申论金句、名师秒杀口诀或 AI Token
      算力卷！
    </div>
  </div>
  <div class="glass-card">
    <div class="card-title">
      <span>💌 跨时空应援信笺墙 (Time-Capsule Letters)</span>
    </div>
    <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem">
      <input
        type="text"
        id="tc-author"
        class="admin-input"
        style="width: 25%; margin-bottom: 0"
        placeholder="署名 (例: 2026冲刺人)"
      />
      <input
        type="text"
        id="tc-content"
        class="admin-input"
        style="width: 60%; margin-bottom: 0"
        placeholder="写下给未来或学弟妹的寄语与鼓励..."
      />
      <button class="btn-fork" style="width: 15%" onclick="sendLetter()">
        📮 投递信笺
      </button>
    </div>
    <div
      id="letters-container"
      style="display: flex; flex-direction: column; gap: 1rem"
    >
      正在加载跨时空信笺墙...
    </div>
  </div>
</section>
